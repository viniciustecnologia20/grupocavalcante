name: Deploy via ftp
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout dos arquivos
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: FTP Deploy Rapido
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASS }}
        server-dir: ./